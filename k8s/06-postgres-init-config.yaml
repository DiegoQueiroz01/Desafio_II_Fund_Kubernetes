apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: segundodesafio
data:
  01-init.sh: |
    #!/bin/bash
    set -eu

    authenticator_password=$(cat /run/secrets/postgres/AUTHENTICATOR_PASSWORD)

    psql --set=authenticator_password="$authenticator_password" \
      --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<'SQL'
    CREATE ROLE web_anon NOLOGIN;
    CREATE ROLE authenticator LOGIN NOINHERIT PASSWORD :'authenticator_password';
    GRANT web_anon TO authenticator;

    CREATE TABLE IF NOT EXISTS public.tarefas (
      id bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
      titulo text NOT NULL,
      concluido boolean NOT NULL DEFAULT false
    );

    REVOKE ALL ON public.tarefas FROM PUBLIC;
    REVOKE ALL ON SEQUENCE public.tarefas_id_seq FROM PUBLIC;
    GRANT USAGE ON SCHEMA public TO web_anon;
    GRANT SELECT, INSERT ON public.tarefas TO web_anon;
    GRANT USAGE, SELECT ON SEQUENCE public.tarefas_id_seq TO web_anon;
    SQL