apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgrest
  namespace: segundodesafio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgrest
  template:
    metadata:
      labels:
        app: postgrest
    spec:
      containers:
      - name: postgrest
        image: postgrest/postgrest:v12.0.2
        ports:
        - containerPort: 3000
        env:
        - name: PGRST_DB_URI
          value: "postgres://appuser:password@postgres-service:5432/appdb"
        - name: PGRST_DB_SCHEMA
          value: "public"
        - name: PGRST_DB_ANON_ROLE
          value: "appuser"
---
apiVersion: v1
kind: Service
metadata:
  name: postgrest-service
  namespace: segundodesafio
spec:
  type: ClusterIP
  selector:
    app: postgrest
  ports:
  - port: 3000
    targetPort: 3000